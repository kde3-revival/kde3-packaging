# xdg-desktop-portal's choice of backends in a KDE 3 session
# (XDG_CURRENT_DESKTOP=KDE3:GNOME), read since xdg-desktop-portal 1.17.
#
# The session lists GNOME as a fallback desktop, so without this file
# xdg-desktop-portal would read gnome-portals.conf and use
# xdg-desktop-portal-gnome, which needs GNOME Shell.  KDE 3 has no portal
# backend of its own; xdg-desktop-portal-gtk provides the file chooser,
# the application chooser (OpenURI), printing, notifications, inhibit,
# account, email, dynamic launchers, lockdown and settings (colour scheme
# from GSettings), and the GNOME keyring the secret portal.
#
# For an interface that the backends listed here do not implement,
# xdg-desktop-portal goes on to the configuration of the next desktop of
# XDG_CURRENT_DESKTOP, gnome-portals.conf, and starts
# xdg-desktop-portal-gnome for it: outside GNOME Shell that backend only
# offers settings, and the applications would find portals that fail.
# The interfaces with no backend for KDE 3 (the GTK versions of
# screenshot, screencast and wallpaper moved to xdg-desktop-portal-gnome)
# are therefore set to none, so that they are not offered at all.
#
# xdg-desktop-portal searches xdg-desktop-portal/kde3-portals.conf in
# $XDG_CONFIG_HOME, $XDG_CONFIG_DIRS, /etc, $XDG_DATA_HOME, $XDG_DATA_DIRS
# and /usr/share.  KDE installs it into its own prefix, which only counts
# when <prefix>/share is in the session's XDG_DATA_DIRS (startkde passes
# XDG_DATA_DIRS on to the D-Bus and systemd activated services); KDE
# installed elsewhere than /usr should also have it in
# /usr/share/xdg-desktop-portal/ (as the packages do) or in
# /etc/xdg-desktop-portal/.

[preferred]
default=gtk;
org.freedesktop.impl.portal.Settings=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
org.freedesktop.impl.portal.Background=none;
org.freedesktop.impl.portal.Clipboard=none;
org.freedesktop.impl.portal.GlobalShortcuts=none;
org.freedesktop.impl.portal.InputCapture=none;
org.freedesktop.impl.portal.RemoteDesktop=none;
org.freedesktop.impl.portal.ScreenCast=none;
org.freedesktop.impl.portal.Screenshot=none;
org.freedesktop.impl.portal.Usb=none;
org.freedesktop.impl.portal.Wallpaper=none;
